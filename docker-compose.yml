services:
  postgres:
    image: postgres:16-alpine
    container_name: medipedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medipedia
    ports:
      - "5432:5432"
    volumes:
      - medipedia_pg_data:/var/lib/postgresql/data

volumes:
  medipedia_pg_data:
